[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clawflight"
version = "0.1.0"
description = "Family flight alerts in your group chat, powered by a forwarding address."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["flight", "tracking", "adsb", "openclaw", "notifications"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Communications :: Chat",
  "Topic :: Utilities",
]

# Intentionally empty. The engine is pure standard library: no runtime
# dependency may be added without a documented reason, because every one of
# them becomes an install and audit burden for a package people run on a
# household machine.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
clawflight = "clawflight.cli:main"

[tool.setuptools.packages.find]
include = ["clawflight*"]

[tool.setuptools.package-data]
clawflight = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
